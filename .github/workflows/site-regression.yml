# Thin launcher; shared checks live in the pinned cto-core commit below.
# Access and evidence contract: uniqore-docs/sdlc/ci.md.
name: Site regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  site-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require private source read access
        env:
          SDLC_READ_TOKEN: ${{ secrets.SDLC_READ_TOKEN }}
        run: |
          if [ -z "$SDLC_READ_TOKEN" ]; then
            echo "::error::Configure SDLC_READ_TOKEN (Contents read on cto-core, uniqore-docs and both sites); see uniqore-docs/sdlc/ci.md"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: uniqore-ai.github.io
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: uniqore-ai/cto-core
          ref: bc5d9cfa0938f11045103ed731a8ca637646adec
          path: cto-core
          token: ${{ secrets.SDLC_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: uniqore-ai/uniqore-docs
          ref: 4c1620f4f312017cb7701925e0e2beb3e2bcce29
          path: uniqore-docs
          token: ${{ secrets.SDLC_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: uniqore-ai/uniqore.kz
          ref: b1e1a0465d6ef4314f58ecc60ac0d855b51e336b
          path: uniqore.kz
          token: ${{ secrets.SDLC_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned export inspector dependencies
        run: python -m pip install -r cto-core/tools/acceptance/requirements.txt
      - name: Install pinned checker dependencies
        working-directory: cto-core/tools/acceptance
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: cto-core/tools/acceptance
        run: npx --no-install playwright install --with-deps chromium
      - name: Run shared checks
        env:
          UNIQORE_ACCEPTANCE_PYTHON: python
        run: >-
          node cto-core/tools/acceptance/ci.mjs sites
          --docs uniqore-docs --kz uniqore.kz --ai uniqore-ai.github.io
          --installer-reference cto-core/tools/acceptance/fixtures/public-installer-reference-v1.json
          --installer-reference-sha256 a087060e00514f3de05dc0f394a45aa7bbe175ea75f65b7dc17161790f860f16
          --out "${{ runner.temp }}/sdlc-evidence"
      - name: Retain results and exact source commits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdlc-evidence
          if-no-files-found: warn
          retention-days: 30
